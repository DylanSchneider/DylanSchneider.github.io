<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0e1c">
<meta name="description" content="Down the Rabbit Hole — check in, enter your costume, and vote for the best.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Down the Rabbit Hole · Costume Contest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="bg-fx"></div>

<main id="app">

  <!-- ─────────────── Boot / fatal error ─────────────── -->
  <section id="v-boot" class="view is-active">
    <div class="wrap">
      <div class="brand">
        <div class="brand__mark">🐰</div>
        <h1 class="brand__title">Wonderland</h1>
        <p class="brand__sub" id="boot-msg">Loading…</p>
      </div>
      <div id="boot-extra"></div>
    </div>
  </section>


  <!-- ─────────────── Step 1 · name + phone ─────────────── -->
  <section id="v-name" class="view">
    <div class="wrap">
      <div id="mode-note"></div>

      <div class="brand">
        <div class="brand__mark">🐰</div>
        <h1 class="brand__title">Down the Rabbit Hole <span id="brand-year"></span></h1>
        <p class="brand__sub">Check in, enter your costume, then vote for the best one in the house.</p>
      </div>

      <div class="steps"><i class="on"></i><i></i></div>

      <form id="form-name" class="panel" novalidate>
        <p class="eyebrow">Step 1 of 2 &middot; Who are you?</p>

        <div class="field" style="margin-top:14px">
          <label class="label" for="in-name">Your real name</label>
          <input class="input" id="in-name" type="text" name="name"
                 autocomplete="name" autocapitalize="words" autocorrect="off"
                 spellcheck="false" enterkeyhint="next" maxlength="60"
                 placeholder="First and last name" required>
          <p class="err" id="err-name"></p>
        </div>

        <div class="field">
          <label class="label" for="in-phone">Mobile number</label>
          <input class="input" id="in-phone" type="tel" name="phone"
                 inputmode="numeric" autocomplete="tel-national"
                 enterkeyhint="go" maxlength="16"
                 placeholder="(555) 123-4567" required>
          <p class="hint">This is just for the guest list and to give you one vote. No texts, ever.</p>
          <p class="err" id="err-phone"></p>
        </div>

        <div class="stack">
          <button class="btn btn--primary btn--block" id="btn-name" type="submit">Continue</button>
        </div>
      </form>
    </div>
  </section>


  <!-- ─────────────── Step 2 · costume ─────────────── -->
  <!-- app.js renders whichever sub-screen applies (choose / solo / group /
       join / edit) into #costume-slot — the shape varies too much for one
       static form. -->
  <section id="v-costume" class="view">
    <div class="wrap">
      <button class="linkback" id="btn-back" type="button">&larr; Back</button>
      <div class="steps"><i class="on"></i><i class="on"></i></div>
      <div id="costume-slot"></div>
    </div>
  </section>


  <!-- ─────────────── Dashboard · vote ─────────────── -->
  <section id="v-dash" class="view">
    <div class="wrap wrap--dash">
      <div class="topbar">
        <div class="topbar__who">
          <span class="eyebrow">Checked in as</span>
          <b id="me-name">&mdash;</b>
        </div>
        <button class="icon-btn" id="btn-refresh" type="button" aria-label="Refresh costumes">↻</button>
        <button class="icon-btn" id="btn-menu" type="button" aria-label="Open menu">⋯</button>
      </div>

      <div id="mode-note-2"></div>

      <div class="clock" id="clock">
        <div class="clock__label" id="clock-label">Voting closes in</div>
        <div class="clock__digits" id="clock-digits"></div>
        <div class="clock__when" id="clock-when"></div>
      </div>

      <div id="winner"></div>

      <div class="status" id="status" hidden>
        <span class="status__icon" id="status-icon">🗳️</span>
        <span id="status-text"></span>
      </div>

      <div class="cards" id="cards"></div>
      <div id="empty"></div>

      <div class="pad-actionbar"></div>
    </div>

    <div class="actionbar" id="actionbar">
      <div class="actionbar__inner">
        <button class="btn btn--primary btn--block" id="btn-vote" type="button">Cast vote</button>
        <p class="actionbar__note" id="vote-note"></p>
      </div>
    </div>
  </section>

</main>

<!-- Bottom sheet menu -->
<dialog class="sheet" id="sheet">
  <div class="sheet__inner">
    <div class="sheet__grip"></div>
    <button class="sheet__item" id="menu-edit" type="button">✏️ Edit my costume</button>
    <button class="sheet__item" id="menu-results" type="button">🏆 Host results (PIN)</button>
    <button class="sheet__item" id="menu-switch" type="button">👤 Not you? Check in as someone else</button>
    <button class="sheet__item sheet__item--close" id="menu-close" type="button">Close</button>
  </div>
</dialog>

<div id="toast" aria-live="polite"></div>

<noscript>
  <div class="wrap">
    <div class="note note--warn"><b>JavaScript is off</b>This page needs JavaScript to check you in and take your vote.</div>
  </div>
</noscript>

<script src="config.js"></script>
<script src="assets/js/wonderland.js" defer></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
