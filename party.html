<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Party photos · Wonderland</title>
<link rel="stylesheet" href="assets/css/app.css?v=20261018-5">
</head>
<body>
<div class="bg-fx"></div>
<main id="party-app">
  <section class="view is-active">
    <div class="wrap wrap--dash party-wrap">
      <div class="topbar topbar--guest">
        <a class="icon-btn" href="index.html" aria-label="Back to party home">←</a>
        <div class="topbar__title">Party pictures</div>
        <button class="icon-btn topbar__refresh" id="party-refresh" type="button" aria-label="Refresh party pictures">↻</button>
      </div>

      <div id="party-mode"></div>
      <div id="party-gate"></div>

      <div id="party-content" hidden>
        <header class="party-hero">
          <p class="eyebrow">Memories of Wonderland</p>
          <h1>Through the<br><em>looking glass</em></h1>
          <p>Tap a photo to see it full size. Touch and hold it, or right-click on a computer, to save it.</p>
          <span class="party-hero__suit" aria-hidden="true">♦</span>
        </header>

        <details class="panel party-camera-panel" id="party-camera-panel">
          <summary class="party-camera-toggle">
            <span class="party-camera-toggle__icon" aria-hidden="true">＋</span>
            <span><b>Add a party photo</b><small>Capture a curious moment</small></span>
            <span class="party-camera-toggle__arrow" aria-hidden="true">⌄</span>
          </summary>
          <div class="party-camera-fields">
            <div class="field" style="margin-top:16px">
              <label class="party-photo-picker" for="party-photo-file">
                <input id="party-photo-file" type="file" accept="image/*" aria-describedby="party-photo-error">
                <span aria-hidden="true">◇</span>
                <b>Take or choose a photo</b>
              </label>
              <p class="err" id="party-photo-error" aria-live="polite"></p>
            </div>
            <div class="party-preview" id="party-preview" hidden>
              <img id="party-preview-image" alt="Party photo preview">
            </div>
            <div class="field">
              <label class="label" for="party-caption">Caption <span class="opt">— optional</span></label>
              <input class="input" id="party-caption" maxlength="120" placeholder="A curious moment…">
            </div>
            <button class="btn btn--primary btn--block" id="party-upload" type="button" disabled>Add to album</button>
            <p class="hint" id="party-upload-status" aria-live="polite"></p>
          </div>
        </details>

        <nav class="party-tabs" role="tablist" aria-label="Photo albums">
          <button class="party-tab" id="tab-party" type="button" role="tab" aria-controls="party-album">Party pictures</button>
          <button class="party-tab" id="tab-costume" type="button" role="tab" aria-controls="costume-album">Costume photos</button>
        </nav>

        <section class="party-album" id="party-album" role="tabpanel" aria-labelledby="tab-party">
          <div class="party-gallery-head">
            <div>
              <p class="eyebrow">Party pictures</p>
              <h2 id="party-gallery-title">Curiouser &amp; curiouser</h2>
            </div>
            <span class="party-photo-count" id="party-count" aria-live="polite"></span>
          </div>
          <div class="party-photo-list" id="party-gallery"></div>
          <div class="party-more" id="party-more"></div>
          <div id="party-empty"></div>
        </section>

        <section class="party-album" id="costume-album" role="tabpanel" aria-labelledby="tab-costume" hidden>
          <div class="party-gallery-head">
            <div>
              <p class="eyebrow">Costume photos</p>
              <h2 id="costume-gallery-title">The cast of characters</h2>
            </div>
            <span class="party-photo-count" id="costume-count" aria-live="polite"></span>
          </div>
          <div class="party-photo-list" id="costume-gallery"></div>
          <div class="party-more" id="costume-more"></div>
          <div id="costume-empty"></div>
        </section>
      </div>
    </div>
  </section>
</main>

<dialog class="photo-viewer" id="photo-viewer" aria-label="Photo viewer">
  <div class="photo-viewer__inner">
    <div class="photo-viewer__bar">
      <span class="photo-viewer__count" id="viewer-count" aria-live="polite"></span>
      <button class="icon-btn" id="viewer-close" type="button" aria-label="Close photo">×</button>
    </div>
    <div class="photo-viewer__stage" id="viewer-stage">
      <button class="photo-viewer__nav photo-viewer__nav--prev" id="viewer-prev" type="button" aria-label="Previous photo" hidden>‹</button>
      <img id="viewer-image" alt="">
      <button class="photo-viewer__nav photo-viewer__nav--next" id="viewer-next" type="button" aria-label="Next photo" hidden>›</button>
    </div>
    <div class="photo-viewer__meta">
      <div>
        <p class="photo-viewer__caption" id="viewer-caption"></p>
        <span class="party-photo-author" id="viewer-author"></span>
      </div>
    </div>
    <div id="viewer-replies"></div>
  </div>
</dialog>
<div id="toast" aria-live="polite"></div>
<script src="config.js"></script>
<script type="module" src="assets/js/party.js?v=20261018-7"></script>
</body>
</html>
